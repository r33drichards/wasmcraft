site_name: wasmcraft
site_description: A pure-Lua WebAssembly engine for CC:Tweaked — with SQLite and Picat in Minecraft.
site_url: https://r33drichards.github.io/wasmcraft/
repo_url: https://github.com/r33drichards/wasmcraft

exclude_docs: |
  plans/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorials:
      - Getting started: tutorials/getting-started.md
      - SQLite in ComputerCraft: tutorials/sqlite-in-computercraft.md
  - How-to guides:
      - Install wasmcraft: how-to/install.md
      - Run a wasm module: how-to/run-a-wasm-module.md
      - Embed the engine: how-to/embed-the-engine.md
      - Run the tests: how-to/run-the-tests.md
      - Rebuild fixtures and the bundle: how-to/rebuild-artifacts.md
      - Applications:
          - Use SQLite from Lua: how-to/use-sqlite-from-lua.md
          - Run Picat programs: how-to/run-picat.md
          - Run a Picat daemon over rednet: how-to/run-a-picat-daemon.md
  - Reference:
      - Lua API: reference/lua-api.md
      - WASI host: reference/wasi.md
      - Command-line tools: reference/cli.md
      - Project layout: reference/project-layout.md
      - Applications:
          - SQL API: reference/sql.md
          - Picat API: reference/picat.md
  - Explanation:
      - Architecture: explanation/architecture.md
      - Cobalt and ComputerCraft: explanation/cobalt-and-computercraft.md
      - WASI and persistence: explanation/wasi-and-persistence.md
