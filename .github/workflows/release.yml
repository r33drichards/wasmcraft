name: release

# Package the in-game programs + wasm binaries and publish them as GitHub
# release assets. The dist scripts bootstrap themselves from
# .../releases/latest/download/<asset>, so updating the release updates what
# in-game computers fetch.
# Releases are IMMUTABLE: cut a NEW version for each release (no asset
# clobbering). releases/latest/download/<asset> follows the newest release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "new release tag (vX.Y.Z) - must not already exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: package
        run: |
          mkdir -p out
          # in-game programs / libraries
          cp dist/wasmcraft.lua out/wasmcraft.lua   # the engine bundle (interp+jit)
          cp dist/picat.lua     out/picat.lua       # picat library (sessions)
          cp dist/picatd.lua    out/picatd.lua      # picat daemon
          cp dist/pic.lua       out/pic.lua         # daemon client / shell
          cp dist/planner.lua   out/planner.lua     # planner monitor demo
          cp dist/pirun.lua     out/pirun.lua       # one-shot picat runner
          cp dist/sqlsh.lua     out/sqlsh.lua       # sqlite shell
          cp dist/wcsql.lua     out/wcsql.lua       # sqlite library
          # web engine (HTML/CSS/JS/React on a monitor) — consumed in-game and
          # by downstream apps (e.g. crabcraft cardui) via releases/latest
          cp dist/browser.lua   out/browser.lua     # web page renderer / event loop
          cp dist/webrender.lua out/webrender.lua   # pure frame-buffer renderer
          # wasm binaries
          cp wasm/picat.wasm    out/picat.wasm      # Picat 3.9 (wasm32-wasi)
          cp wasm/wq.wasm       out/wq.wasm         # SQLite 3.53 query engine
          cp wasm/web.wasm      out/web.wasm        # web engine (QuickJS + draw protocol)
          (cd out && sha256sum * > SHA256SUMS)
          ls -la out

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          {
            echo "Pure-Lua WebAssembly runtime for CC:Tweaked (Cobalt): interpreter + wasm->Lua-bytecode compiler, WASI, SQLite, Picat with warm rednet-served sessions."
            echo
            echo "In-game install:"
            echo '```'
            for f in picatd.lua pic.lua planner.lua sqlsh.lua; do
              echo "wget https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$f ${f%.lua}"
            done
            echo '```'
            echo "picat.wasm (5.3 MB) goes on a floppy on the daemon computer."
          } > notes.md
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $VERSION already exists - releases are immutable, pick a new version" >&2
            exit 1
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --title "wasmcraft $VERSION" --notes-file notes.md out/*
